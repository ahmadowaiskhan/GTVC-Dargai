<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('gtvc_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="GTVC Dargai - Offline Database Management System Portal">
  <title>Portal — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
  <script src="/assets/login.js" defer></script>
</head>
<body>
  <div class="login-page">
    <div class="login-card login-card-wide">
      <img src="/assets/logo/GTVC-Logo.png" alt="GTVC Dargai Logo" class="login-logo" style="width:80px; height:80px; border-radius:50%; object-fit:cover;">
      <h1>GTVC Dargai</h1>
      <p class="subtitle">Government Technical & Vocational Centre, Malakand</p>

      <!-- Dynamic Admission Notice Banner -->
      <div id="admissionNoticeBanner" style="display:none; margin: 14px 0 18px;"></div>

      <!-- Auth Switcher Tabs -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tabLoginBtn">Sign In</button>
        <button type="button" class="auth-tab-btn" id="tabSignupBtn">Sign Up</button>
      </div>

      <!-- Login Section -->
      <div id="loginSection">
        <div id="loginError" class="alert alert-danger login-alert hidden"></div>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" class="form-input" placeholder="Enter your username" required autocomplete="username">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
        </form>

        <p class="login-footer-link mt-2">
          Don't have an account? <a href="#" id="toSignupLink">Create Account</a>
        </p>
      </div>

      <!-- Signup Section -->
      <div id="signupSection" class="hidden">
        <div id="signupAlert" class="alert login-alert hidden"></div>

        <form id="signupForm">
          <div class="form-row form-row-2col">
            <div class="form-group">
              <label class="form-label" for="signup_fullname">Full Name <span class="required-star">*</span></label>
              <input type="text" id="signup_fullname" class="form-input" placeholder="e.g. Ahmad Khan" required autocomplete="name">
            </div>
            <div class="form-group">
              <label class="form-label" for="signup_username">Username <span class="required-star">*</span></label>
              <input type="text" id="signup_username" class="form-input" placeholder="e.g. ahmad_k" required autocomplete="username">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup_role">Account Role <span class="required-star">*</span></label>
            <select id="signup_role" class="form-input" required>
              <option value="admin" selected>Administrator</option>
              <option value="teacher">Teacher / Instructor</option>
              <option value="accounting">Accounting / Finance</option>
            </select>
          </div>

          <div class="form-row form-row-2col">
            <div class="form-group">
              <label class="form-label" for="signup_email">Email Address</label>
              <input type="email" id="signup_email" class="form-input" placeholder="name@gtvc.edu.pk" autocomplete="email">
            </div>
            <div class="form-group">
              <label class="form-label" for="signup_phone">Phone Number</label>
              <input type="text" id="signup_phone" class="form-input" placeholder="0300-1234567" autocomplete="tel">
            </div>
          </div>

          <div class="form-row form-row-2col">
            <div class="form-group">
              <label class="form-label" for="signup_password">Password <span class="required-star">*</span></label>
              <input type="password" id="signup_password" class="form-input" placeholder="Min. 6 characters" required autocomplete="new-password" minlength="6">
            </div>
            <div class="form-group">
              <label class="form-label" for="signup_confirm_password">Confirm Password <span class="required-star">*</span></label>
              <input type="password" id="signup_confirm_password" class="form-input" placeholder="Repeat password" required autocomplete="new-password" minlength="6">
            </div>
          </div>

          <button type="submit" class="btn btn-primary signup-btn" id="signupBtn">Create Account</button>
        </form>

        <p class="login-footer-link mt-2">
          Already have an account? <a href="#" id="toLoginLink">Log In</a>
        </p>
      </div>

      <!-- Footer & Theme Toggle -->
      <div class="login-footer">
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">Theme</button>
        <p class="login-footer-system">Offline Database Management System</p>
      </div>
    </div>
  </div>
</body>
</html>
