<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notices — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-navbar"></header>
      <main class="app-content">

        <div class="page-header">
          <h1>Notice Board</h1>
          <p>Post and view notices.</p>
        </div>

        <!-- Post Notice Form -->
        <div class="card mb-3">
          <div class="card-header">
            <h3 class="card-title">Post a Notice</h3>
          </div>
          <form id="noticeForm" onsubmit="postNotice(event)">
            <div class="form-group">
              <label class="form-label">Title *</label>
              <input type="text" id="noticeTitle" class="form-input" required placeholder="Notice title">
            </div>
            <div class="form-group">
              <label class="form-label">Content *</label>
              <textarea id="noticeContent" class="form-textarea" required placeholder="Write notice content..."></textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Target Audience</label>
                <select id="noticeTarget" class="form-select">
                  <option value="all">All</option>
                  <option value="teacher">Teachers Only</option>
                  <option value="student">Students Only</option>
                </select>
              </div>
              <div class="form-group" style="display:flex; align-items:flex-end;">
                <button type="submit" class="btn btn-primary">Post Notice</button>
              </div>
            </div>
          </form>
        </div>

        <!-- Notices List -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">All Notices</h3>
          </div>
          <div id="noticesList">
            <div class="empty-state">
              <p>No notices posted yet.</p>
            </div>
          </div>
        </div>

      </main>
      <footer class="app-footer"></footer>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth(['principal'])) return;
      renderLayout('principal', 'Notices', 'notices.html');
      loadNotices();
    });

    async function loadNotices() {
      try {
        const data = await apiCall('/api/notices');
        const list = document.getElementById('noticesList');
        if (!data || !data.length) {
          list.innerHTML = '<div class="empty-state"><p>No notices posted yet.</p></div>';
          return;
        }
        list.innerHTML = data.map(n => `
          <div class="card" style="margin-bottom:12px; padding:16px;">
            <div class="flex-between">
              <h4>${n.title}</h4>
              <span class="badge badge-blue">${n.target_role || 'all'}</span>
            </div>
            <p style="margin:8px 0; color:var(--text-secondary); font-size:0.9rem;">${n.content}</p>
            <div style="font-size:0.8rem; color:var(--text-muted);">
              Posted: ${formatDate(n.created_at)}
            </div>
          </div>
        `).join('');
      } catch (e) { /* */ }
    }

    async function postNotice(e) {
      e.preventDefault();
      const body = {
        title: document.getElementById('noticeTitle').value,
        content: document.getElementById('noticeContent').value,
        target_role: document.getElementById('noticeTarget').value,
      };
      try {
        await apiCall('/api/notices', 'POST', body);
        showToast('Notice posted');
        document.getElementById('noticeForm').reset();
        loadNotices();
      } catch (e) { showToast('Error posting notice', 'danger'); }
    }
  </script>
</body>
</html>
