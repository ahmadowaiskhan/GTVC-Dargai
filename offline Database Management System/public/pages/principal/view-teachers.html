<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Teachers — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-navbar"></header>
      <main class="app-content">

        <div class="page-header">
          <h1>View Teachers</h1>
          <p>All registered teaching staff (read-only).</p>
        </div>

        <div class="toolbar">
          <div class="search-box">
            <input type="text" id="searchTeachers" placeholder="Search teachers..." oninput="filterTeachers()">
          </div>
        </div>

        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Employee ID</th>
                  <th>Full Name</th>
                  <th>Specialization</th>
                  <th>Qualification</th>
                  <th>Joining Date</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="teachersTableBody">
                <tr><td colspan="7" class="text-center text-muted" style="padding:32px;">Loading teachers...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
      <footer class="app-footer"></footer>
    </div>
  </div>

  <script>
    let allTeachers = [];
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth(['principal'])) return;
      renderLayout('principal', 'View Teachers', 'view-teachers.html');
      loadTeachers();
    });

    async function loadTeachers() {
      try {
        const data = await apiCall('/api/principal/teachers');
        allTeachers = data || [];
        renderTeachers(allTeachers);
      } catch (e) {
        document.getElementById('teachersTableBody').innerHTML =
          '<tr><td colspan="7" class="text-center text-muted" style="padding:32px;">Could not load teachers.</td></tr>';
      }
    }

    function renderTeachers(teachers) {
      const tbody = document.getElementById('teachersTableBody');
      if (!teachers.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted" style="padding:32px;">No teachers found.</td></tr>';
        return;
      }
      tbody.innerHTML = teachers.map((t, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${t.employee_id || '—'}</td>
          <td>${t.full_name || '—'}</td>
          <td>${t.specialization || '—'}</td>
          <td>${t.qualification || '—'}</td>
          <td>${formatDate(t.joining_date)}</td>
          <td><span class="badge ${t.is_active ? 'badge-green' : 'badge-red'}">${t.is_active ? 'Active' : 'Inactive'}</span></td>
        </tr>
      `).join('');
    }

    function filterTeachers() {
      const q = document.getElementById('searchTeachers').value.toLowerCase();
      renderTeachers(allTeachers.filter(t =>
        (t.full_name || '').toLowerCase().includes(q) ||
        (t.specialization || '').toLowerCase().includes(q)
      ));
    }
  </script>
</body>
</html>
