<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Results — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-navbar"></header>
      <main class="app-content">

        <div class="page-header">
          <h1>View Results</h1>
          <p>Student exam results across all classes (read-only).</p>
        </div>

        <div class="toolbar">
          <div class="search-box">
            <input type="text" id="searchResults" placeholder="Search by student name..." oninput="filterResults()">
          </div>
          <select id="filterExamType" class="form-select" style="width:auto;" onchange="filterResults()">
            <option value="">All Exam Types</option>
            <option value="monthly">Monthly</option>
            <option value="midterm">Midterm</option>
            <option value="final">Final</option>
            <option value="practical">Practical</option>
          </select>
        </div>

        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Student Name</th>
                  <th>Class</th>
                  <th>Subject</th>
                  <th>Exam Type</th>
                  <th>Obtained</th>
                  <th>Total</th>
                  <th>Grade</th>
                </tr>
              </thead>
              <tbody id="resultsTableBody">
                <tr><td colspan="8" class="text-center text-muted" style="padding:32px;">Loading results...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
      <footer class="app-footer"></footer>
    </div>
  </div>

  <script>
    let allResults = [];
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth(['principal'])) return;
      renderLayout('principal', 'View Results', 'view-results.html');
      loadResults();
    });

    async function loadResults() {
      try {
        const data = await apiCall('/api/principal/results');
        allResults = data || [];
        renderResults(allResults);
      } catch (e) {
        document.getElementById('resultsTableBody').innerHTML =
          '<tr><td colspan="8" class="text-center text-muted" style="padding:32px;">Could not load results.</td></tr>';
      }
    }

    function renderResults(results) {
      const tbody = document.getElementById('resultsTableBody');
      if (!results.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted" style="padding:32px;">No results found.</td></tr>';
        return;
      }
      const gradeBadge = g => {
        const map = { A: 'badge-green', B: 'badge-blue', C: 'badge-yellow', D: 'badge-yellow', F: 'badge-red' };
        return `<span class="badge ${map[g] || 'badge-blue'}">${g}</span>`;
      };
      tbody.innerHTML = results.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${r.student_name || '—'}</td>
          <td>${r.class_name || '—'}</td>
          <td>${r.subject_name || '—'}</td>
          <td><span class="badge badge-blue">${r.exam_type}</span></td>
          <td>${r.marks_obtained ?? '—'}</td>
          <td>${r.total_marks ?? '—'}</td>
          <td>${gradeBadge(r.grade || '—')}</td>
        </tr>
      `).join('');
    }

    function filterResults() {
      const q = document.getElementById('searchResults').value.toLowerCase();
      const exam = document.getElementById('filterExamType').value;
      renderResults(allResults.filter(r => {
        const match = (r.student_name || '').toLowerCase().includes(q);
        return match && (!exam || r.exam_type === exam);
      }));
    }
  </script>
</body>
</html>
