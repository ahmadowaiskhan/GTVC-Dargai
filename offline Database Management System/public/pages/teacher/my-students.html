<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Students — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-navbar"></header>
      <main class="app-content">

        <div class="page-header">
          <h1>My Students</h1>
          <p>Students enrolled in your assigned classes.</p>
        </div>

        <div class="toolbar">
          <div class="search-box">
            <input type="text" id="searchStudents" placeholder="Search students..." oninput="filterStudents()">
          </div>
          <select id="filterClass" class="form-select" style="width:auto;" onchange="loadStudents()">
            <option value="">All My Classes</option>
          </select>
        </div>

        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Student ID</th>
                  <th>Full Name</th>
                  <th>Father Name</th>
                  <th>Roll No</th>
                  <th>Phone</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="studentsTableBody">
                <tr><td colspan="7" class="text-center text-muted" style="padding:32px;">Loading students...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
      <footer class="app-footer"></footer>
    </div>
  </div>

  <script>
    let allStudents = [];

    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth(['teacher'])) return;
      renderLayout('teacher', 'My Students', 'my-students.html');
      loadClasses();
      loadStudents();
    });

    async function loadClasses() {
      try {
        const data = await apiCall('/api/teacher/my-classes');
        const sel = document.getElementById('filterClass');
        (data || []).forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.class_name;
          sel.appendChild(opt);
        });
      } catch (e) { /* */ }
    }

    async function loadStudents() {
      const classId = document.getElementById('filterClass').value;
      const url = classId ? `/api/teacher/my-students?class_id=${classId}` : '/api/teacher/my-students';
      try {
        const data = await apiCall(url);
        allStudents = data || [];
        renderStudents(allStudents);
      } catch (e) {
        document.getElementById('studentsTableBody').innerHTML =
          '<tr><td colspan="7" class="text-center text-muted" style="padding:32px;">Could not load students.</td></tr>';
      }
    }

    function renderStudents(students) {
      const tbody = document.getElementById('studentsTableBody');
      if (!students.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted" style="padding:32px;">No students found.</td></tr>';
        return;
      }
      const statusBadge = s => {
        const map = { active: 'badge-green', passed: 'badge-blue', dropped: 'badge-red', absent: 'badge-yellow' };
        return `<span class="badge ${map[s] || 'badge-blue'}">${s}</span>`;
      };
      tbody.innerHTML = students.map((s, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${s.student_id || '—'}</td>
          <td>${s.full_name}</td>
          <td>${s.father_name || '—'}</td>
          <td>${s.roll_number || '—'}</td>
          <td>${s.phone || '—'}</td>
          <td>${statusBadge(s.status)}</td>
        </tr>
      `).join('');
    }

    function filterStudents() {
      const q = document.getElementById('searchStudents').value.toLowerCase();
      renderStudents(allStudents.filter(s =>
        s.full_name.toLowerCase().includes(q) ||
        (s.student_id || '').toLowerCase().includes(q)
      ));
    }
  </script>
</body>
</html>
