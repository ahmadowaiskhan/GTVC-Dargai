<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('gtvc_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <title>Notices — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-navbar"></header>
      <main class="app-content">

        <div class="page-header">
          <h1>Notices</h1>
          <p>Latest notices and announcements from the administration.</p>
        </div>

        <div id="noticesList">
          <div class="empty-state">
            <p>No notices available.</p>
          </div>
        </div>

      </main>
      <footer class="app-footer"></footer>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth(['teacher'])) return;
      renderLayout('teacher', 'Notices', 'notices.html');
      loadNotices();
    });

    async function loadNotices() {
      try {
        const data = await apiCall('/api/notices');
        const list = document.getElementById('noticesList');
        if (!data || !data.length) {
          list.innerHTML = '<div class="empty-state"><p>No notices available.</p></div>';
          return;
        }
        list.innerHTML = data.map(n => `
          <div class="card" style="margin-bottom:12px; padding:16px;">
            <div class="flex-between">
              <h4>${n.title}</h4>
              <span class="badge badge-blue">${n.target_role || 'all'}</span>
            </div>
            <p style="margin:8px 0; color:var(--text-secondary); font-size:0.9rem;">${n.content}</p>
            <div style="font-size:0.8rem; color:var(--text-muted);">
              Posted: ${formatDate(n.created_at)}
            </div>
          </div>
        `).join('');
      } catch (e) { /* */ }
    }
  </script>
</body>
</html>
