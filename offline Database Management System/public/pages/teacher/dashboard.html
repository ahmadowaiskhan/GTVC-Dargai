<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-navbar"></header>
      <main class="app-content">

        <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));">
          <div class="stat-card">
            <div class="stat-value" id="myStudents">0</div>
            <div class="stat-label">My Students</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="myClasses">0</div>
            <div class="stat-label">My Classes</div>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="card mb-3">
          <div class="card-header">
            <h3 class="card-title">Quick Actions</h3>
          </div>
          <div class="btn-group">
            <a href="results.html" class="btn btn-success">Enter Results</a>
            <a href="my-students.html" class="btn btn-outline">View My Students</a>
          </div>
        </div>

        <!-- Recent Notices -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Recent Notices</h3>
            <a href="notices.html" class="btn btn-outline btn-sm">View All</a>
          </div>
          <div id="recentNotices">
            <div class="empty-state">
              <p>No notices yet.</p>
            </div>
          </div>
        </div>

      </main>
      <footer class="app-footer"></footer>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth(['teacher'])) return;
      renderLayout('teacher', 'Dashboard', 'dashboard.html');
      loadTeacherDashboard();
    });

    async function loadTeacherDashboard() {
      try {
        const data = await apiCall('/api/teacher/dashboard');
        if (data) {
          document.getElementById('myStudents').textContent = data.myStudents || 0;
          document.getElementById('myClasses').textContent = data.myClasses || 0;
        }
      } catch (e) { /* API not ready */ }
    }
  </script>
</body>
</html>
