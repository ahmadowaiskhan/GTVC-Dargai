<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Results — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-navbar"></header>
      <main class="app-content">

        <div class="page-header">
          <h1>Enter Results</h1>
          <p>Enter exam marks for your students.</p>
        </div>

        <!-- Selection Controls -->
        <div class="card mb-3">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Class</label>
              <select id="resultClass" class="form-select" onchange="loadSubjects()">
                <option value="">— Choose class —</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Subject</label>
              <select id="resultSubject" class="form-select">
                <option value="">— Choose subject —</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Exam Type</label>
              <select id="resultExamType" class="form-select">
                <option value="monthly">Monthly Test</option>
                <option value="midterm">Midterm</option>
                <option value="final">Final Exam</option>
                <option value="practical">Practical</option>
              </select>
            </div>
            <div class="form-group" style="display:flex; align-items:flex-end;">
              <button class="btn btn-primary" onclick="loadResultStudents()">Load Students</button>
            </div>
          </div>
        </div>

        <!-- Marks Entry Table -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Marks Entry</h3>
            <button class="btn btn-success" onclick="submitResults()" id="submitResultsBtn" disabled>Save Results</button>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Student ID</th>
                  <th>Name</th>
                  <th>Total Marks</th>
                  <th>Obtained Marks</th>
                  <th>Grade</th>
                </tr>
              </thead>
              <tbody id="resultsTableBody">
                <tr><td colspan="6" class="text-center text-muted" style="padding:32px;">Select class, subject and exam type, then click Load Students.</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
      <footer class="app-footer"></footer>
    </div>
  </div>

  <script>
    let resultStudents = [];

    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth(['teacher'])) return;
      renderLayout('teacher', 'Enter Results', 'results.html');
      loadClasses();
    });

    async function loadClasses() {
      try {
        const data = await apiCall('/api/teacher/my-classes');
        const sel = document.getElementById('resultClass');
        (data || []).forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.class_name;
          sel.appendChild(opt);
        });
      } catch (e) { /* */ }
    }

    async function loadSubjects() {
      const classId = document.getElementById('resultClass').value;
      const sel = document.getElementById('resultSubject');
      sel.innerHTML = '<option value="">— Choose subject —</option>';
      if (!classId) return;
      try {
        const data = await apiCall(`/api/teacher/subjects?class_id=${classId}`);
        (data || []).forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = s.subject_name;
          sel.appendChild(opt);
        });
      } catch (e) { /* */ }
    }

    async function loadResultStudents() {
      const classId = document.getElementById('resultClass').value;
      const subjectId = document.getElementById('resultSubject').value;
      if (!classId || !subjectId) { alert('Please select class and subject.'); return; }

      try {
        const data = await apiCall(`/api/teacher/my-students?class_id=${classId}`);
        resultStudents = (data || []).map(s => ({ ...s, marks_obtained: '', total_marks: 100 }));
        renderResultsTable();
        document.getElementById('submitResultsBtn').disabled = false;
      } catch (e) {
        document.getElementById('resultsTableBody').innerHTML =
          '<tr><td colspan="6" class="text-center text-muted" style="padding:32px;">Could not load students.</td></tr>';
      }
    }

    function calculateGrade(obtained, total) {
      if (!obtained || !total) return '—';
      const pct = (obtained / total) * 100;
      if (pct >= 80) return 'A';
      if (pct >= 70) return 'B';
      if (pct >= 60) return 'C';
      if (pct >= 50) return 'D';
      return 'F';
    }

    function renderResultsTable() {
      const tbody = document.getElementById('resultsTableBody');
      if (!resultStudents.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted" style="padding:32px;">No students found.</td></tr>';
        return;
      }
      tbody.innerHTML = resultStudents.map((s, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${s.student_id || '—'}</td>
          <td>${s.full_name}</td>
          <td><input type="number" class="form-input" style="width:80px;" value="${s.total_marks}" onchange="updateMarks(${i}, 'total', this.value)"></td>
          <td><input type="number" class="form-input" style="width:80px;" value="${s.marks_obtained}" placeholder="0" oninput="updateMarks(${i}, 'obtained', this.value)"></td>
          <td id="grade-${i}">${calculateGrade(s.marks_obtained, s.total_marks)}</td>
        </tr>
      `).join('');
    }

    function updateMarks(index, field, value) {
      if (field === 'obtained') resultStudents[index].marks_obtained = parseFloat(value) || 0;
      if (field === 'total') resultStudents[index].total_marks = parseFloat(value) || 100;
      const s = resultStudents[index];
      document.getElementById(`grade-${index}`).textContent = calculateGrade(s.marks_obtained, s.total_marks);
    }

    async function submitResults() {
      const classId = document.getElementById('resultClass').value;
      const subjectId = document.getElementById('resultSubject').value;
      const examType = document.getElementById('resultExamType').value;

      const records = resultStudents.map(s => ({
        student_id: s.id,
        marks_obtained: s.marks_obtained,
        total_marks: s.total_marks,
        grade: calculateGrade(s.marks_obtained, s.total_marks),
      }));

      try {
        await apiCall('/api/teacher/results', 'POST', {
          class_id: classId,
          subject_id: subjectId,
          exam_type: examType,
          records
        });
        showToast('Results saved successfully!');
      } catch (e) {
        showToast('Error saving results', 'danger');
      }
    }
  </script>
</body>
</html>
