<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Teachers — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-navbar"></header>
      <main class="app-content">

        <div class="page-header">
          <h1>Manage Teachers</h1>
          <p>View and manage teacher records.</p>
        </div>

        <div class="toolbar">
          <div class="search-box">
            <input type="text" id="searchTeachers" placeholder="Search teachers..." oninput="filterTeachers()">
          </div>
          <button class="btn btn-primary" onclick="openAddTeacherModal()">Add Teacher</button>
        </div>

        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Employee ID</th>
                  <th>Full Name</th>
                  <th>CNIC</th>
                  <th>Specialization</th>
                  <th>Joining Date</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="teachersTableBody">
                <tr><td colspan="8" class="text-center text-muted" style="padding:32px;">Loading teachers...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
      <footer class="app-footer"></footer>
    </div>
  </div>

  <!-- Add Teacher Modal -->
  <div class="modal-overlay" id="teacherModal">
    <div class="modal" style="max-width:600px;">
      <div class="modal-header">
        <h3 id="teacherModalTitle">Add New Teacher</h3>
        <button class="modal-close" onclick="closeTeacherModal()">✕</button>
      </div>
      <form id="teacherForm" onsubmit="saveTeacher(event)">
        <input type="hidden" id="teacherId">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="tFullName" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Employee ID</label>
            <input type="text" id="tEmployeeId" class="form-input" placeholder="GTVC-T-001">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">CNIC</label>
            <input type="text" id="tCnic" class="form-input" placeholder="XXXXX-XXXXXXX-X">
          </div>
          <div class="form-group">
            <label class="form-label">Gender</label>
            <select id="tGender" class="form-select">
              <option value="">Select</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Qualification</label>
            <input type="text" id="tQualification" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Specialization</label>
            <input type="text" id="tSpecialization" class="form-input" placeholder="e.g. Electrician, Computer">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Date of Birth</label>
            <input type="date" id="tDob" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Joining Date</label>
            <input type="date" id="tJoiningDate" class="form-input">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <textarea id="tAddress" class="form-textarea" rows="2"></textarea>
        </div>
        <div class="btn-group" style="margin-top:8px;">
          <button type="submit" class="btn btn-primary">Save Teacher</button>
          <button type="button" class="btn btn-outline" onclick="closeTeacherModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allTeachers = [];

    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth(['admin'])) return;
      renderLayout('admin', 'Manage Teachers', 'manage-teachers.html');
      loadTeachers();
    });

    async function loadTeachers() {
      try {
        const data = await apiCall('/api/admin/teachers');
        allTeachers = data || [];
        renderTeachers(allTeachers);
      } catch (e) {
        document.getElementById('teachersTableBody').innerHTML =
          '<tr><td colspan="8" class="text-center text-muted" style="padding:32px;">Could not load teachers.</td></tr>';
      }
    }

    function renderTeachers(teachers) {
      const tbody = document.getElementById('teachersTableBody');
      if (!teachers.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted" style="padding:32px;">No teachers found.</td></tr>';
        return;
      }
      tbody.innerHTML = teachers.map((t, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${t.employee_id || '—'}</td>
          <td>${t.full_name || t.user_full_name || '—'}</td>
          <td>${t.cnic || '—'}</td>
          <td>${t.specialization || '—'}</td>
          <td>${formatDate(t.joining_date)}</td>
          <td><span class="badge ${t.is_active ? 'badge-green' : 'badge-red'}">${t.is_active ? 'Active' : 'Inactive'}</span></td>
          <td>
            <div class="btn-group">
              <button class="btn btn-outline btn-sm" onclick="editTeacher(${t.id})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteTeacher(${t.id})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterTeachers() {
      const q = document.getElementById('searchTeachers').value.toLowerCase();
      const filtered = allTeachers.filter(t =>
        (t.full_name || '').toLowerCase().includes(q) ||
        (t.employee_id || '').toLowerCase().includes(q) ||
        (t.specialization || '').toLowerCase().includes(q)
      );
      renderTeachers(filtered);
    }

    function openAddTeacherModal() {
      document.getElementById('teacherModalTitle').textContent = 'Add New Teacher';
      document.getElementById('teacherForm').reset();
      document.getElementById('teacherId').value = '';
      document.getElementById('teacherModal').classList.add('active');
    }

    function closeTeacherModal() {
      document.getElementById('teacherModal').classList.remove('active');
    }

    function editTeacher(id) {
      const t = allTeachers.find(x => x.id === id);
      if (!t) return;
      document.getElementById('teacherModalTitle').textContent = 'Edit Teacher';
      document.getElementById('teacherId').value = t.id;
      document.getElementById('tFullName').value = t.full_name || '';
      document.getElementById('tEmployeeId').value = t.employee_id || '';
      document.getElementById('tCnic').value = t.cnic || '';
      document.getElementById('tGender').value = t.gender || '';
      document.getElementById('tQualification').value = t.qualification || '';
      document.getElementById('tSpecialization').value = t.specialization || '';
      document.getElementById('tDob').value = t.date_of_birth ? t.date_of_birth.split('T')[0] : '';
      document.getElementById('tJoiningDate').value = t.joining_date ? t.joining_date.split('T')[0] : '';
      document.getElementById('tAddress').value = t.address || '';
      document.getElementById('teacherModal').classList.add('active');
    }

    async function saveTeacher(e) {
      e.preventDefault();
      const id = document.getElementById('teacherId').value;
      const body = {
        full_name: document.getElementById('tFullName').value,
        employee_id: document.getElementById('tEmployeeId').value,
        cnic: document.getElementById('tCnic').value,
        gender: document.getElementById('tGender').value,
        qualification: document.getElementById('tQualification').value,
        specialization: document.getElementById('tSpecialization').value,
        date_of_birth: document.getElementById('tDob').value,
        joining_date: document.getElementById('tJoiningDate').value,
        address: document.getElementById('tAddress').value,
      };
      try {
        if (id) {
          await apiCall(`/api/admin/teachers/${id}`, 'PUT', body);
          showToast('Teacher updated successfully');
        } else {
          await apiCall('/api/admin/teachers', 'POST', body);
          showToast('Teacher added successfully');
        }
        closeTeacherModal();
        loadTeachers();
      } catch (e) { showToast('Error saving teacher', 'danger'); }
    }

    async function deleteTeacher(id) {
      if (!confirmAction('Delete this teacher?')) return;
      try {
        await apiCall(`/api/admin/teachers/${id}`, 'DELETE');
        showToast('Teacher deleted');
        loadTeachers();
      } catch (e) { showToast('Error deleting teacher', 'danger'); }
    }
  </script>
</body>
</html>
