<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Courses — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-navbar"></header>
      <main class="app-content">

        <div class="page-header">
          <h1>Manage Courses</h1>
          <p>Add and manage trade courses and class batches.</p>
        </div>

        <div class="toolbar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchCourses" placeholder="Search courses..." oninput="filterCourses()">
          </div>
          <button class="btn btn-primary" onclick="openAddCourseModal()">➕ Add Course</button>
        </div>

        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Course Code</th>
                  <th>Course Name</th>
                  <th>Duration (Months)</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="coursesTableBody">
                <tr><td colspan="6" class="text-center text-muted" style="padding:32px;">Loading courses...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
      <footer class="app-footer"></footer>
    </div>
  </div>

  <!-- Add/Edit Course Modal -->
  <div class="modal-overlay" id="courseModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="courseModalTitle">Add New Course</h3>
        <button class="modal-close" onclick="closeCourseModal()">✕</button>
      </div>
      <form id="courseForm" onsubmit="saveCourse(event)">
        <input type="hidden" id="courseId">
        <div class="form-group">
          <label class="form-label">Course Name *</label>
          <input type="text" id="cCourseName" class="form-input" required placeholder="e.g. Electrician, Plumber, Computer">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Course Code</label>
            <input type="text" id="cCourseCode" class="form-input" placeholder="e.g. ELEC-01">
          </div>
          <div class="form-group">
            <label class="form-label">Duration (Months)</label>
            <input type="number" id="cDuration" class="form-input" min="1" max="60">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="cDescription" class="form-textarea" rows="3"></textarea>
        </div>
        <div class="btn-group" style="margin-top:8px;">
          <button type="submit" class="btn btn-primary">Save Course</button>
          <button type="button" class="btn btn-outline" onclick="closeCourseModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allCourses = [];

    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth(['admin'])) return;
      renderLayout('admin', 'Manage Courses', 'manage-courses.html');
      loadCourses();
    });

    async function loadCourses() {
      try {
        const data = await apiCall('/api/admin/courses');
        allCourses = data || [];
        renderCourses(allCourses);
      } catch (e) {
        document.getElementById('coursesTableBody').innerHTML =
          '<tr><td colspan="6" class="text-center text-muted" style="padding:32px;">Could not load courses.</td></tr>';
      }
    }

    function renderCourses(courses) {
      const tbody = document.getElementById('coursesTableBody');
      if (!courses.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted" style="padding:32px;">No courses found.</td></tr>';
        return;
      }
      tbody.innerHTML = courses.map((c, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${c.course_code || '—'}</td>
          <td>${c.course_name}</td>
          <td>${c.duration_months || '—'}</td>
          <td><span class="badge ${c.is_active ? 'badge-green' : 'badge-red'}">${c.is_active ? 'Active' : 'Inactive'}</span></td>
          <td>
            <div class="btn-group">
              <button class="btn btn-outline btn-sm" onclick="editCourse(${c.id})">✏️ Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteCourse(${c.id})">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterCourses() {
      const q = document.getElementById('searchCourses').value.toLowerCase();
      renderCourses(allCourses.filter(c => c.course_name.toLowerCase().includes(q) || (c.course_code || '').toLowerCase().includes(q)));
    }

    function openAddCourseModal() {
      document.getElementById('courseModalTitle').textContent = 'Add New Course';
      document.getElementById('courseForm').reset();
      document.getElementById('courseId').value = '';
      document.getElementById('courseModal').classList.add('active');
    }
    function closeCourseModal() { document.getElementById('courseModal').classList.remove('active'); }

    function editCourse(id) {
      const c = allCourses.find(x => x.id === id);
      if (!c) return;
      document.getElementById('courseModalTitle').textContent = 'Edit Course';
      document.getElementById('courseId').value = c.id;
      document.getElementById('cCourseName').value = c.course_name;
      document.getElementById('cCourseCode').value = c.course_code || '';
      document.getElementById('cDuration').value = c.duration_months || '';
      document.getElementById('cDescription').value = c.description || '';
      document.getElementById('courseModal').classList.add('active');
    }

    async function saveCourse(e) {
      e.preventDefault();
      const id = document.getElementById('courseId').value;
      const body = {
        course_name: document.getElementById('cCourseName').value,
        course_code: document.getElementById('cCourseCode').value,
        duration_months: document.getElementById('cDuration').value,
        description: document.getElementById('cDescription').value,
      };
      try {
        if (id) { await apiCall(`/api/admin/courses/${id}`, 'PUT', body); showToast('Course updated'); }
        else { await apiCall('/api/admin/courses', 'POST', body); showToast('Course added'); }
        closeCourseModal(); loadCourses();
      } catch (e) { showToast('Error saving course', 'danger'); }
    }

    async function deleteCourse(id) {
      if (!confirmAction('Delete this course?')) return;
      try { await apiCall(`/api/admin/courses/${id}`, 'DELETE'); showToast('Course deleted'); loadCourses(); }
      catch (e) { showToast('Error', 'danger'); }
    }
  </script>
</body>
</html>
