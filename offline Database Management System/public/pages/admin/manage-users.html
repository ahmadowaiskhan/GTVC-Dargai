<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('gtvc_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <title>Manage Users — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-navbar"></header>
      <main class="app-content">

        <div class="page-header">
          <h1>Manage Users</h1>
          <p>Add, edit, or deactivate user accounts (Admin, Principal, Teacher).</p>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
          <div class="search-box">
            <input type="text" id="searchUsers" placeholder="Search users..." oninput="filterUsers()">
          </div>
          <button class="btn btn-primary" onclick="openAddUserModal()">Add User</button>
        </div>

        <!-- Users Table -->
        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Full Name</th>
                  <th>Username</th>
                  <th>Role</th>
                  <th>Email</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <tr><td colspan="7" class="text-center text-muted" style="padding:32px;">Loading users...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
      <footer class="app-footer"></footer>
    </div>
  </div>

  <!-- Add/Edit User Modal -->
  <div class="modal-overlay" id="userModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="userModalTitle">Add New User</h3>
        <button class="modal-close" onclick="closeUserModal()">✕</button>
      </div>
      <form id="userForm" onsubmit="saveUser(event)">
        <input type="hidden" id="userId">
        <div class="form-group">
          <label class="form-label" for="userFullName">Full Name</label>
          <input type="text" id="userFullName" class="form-input" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="userUsername">Username</label>
            <input type="text" id="userUsername" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="userRole">Role</label>
            <select id="userRole" class="form-select" required>
              <option value="">Select Role</option>
              <option value="admin">Admin</option>
              <option value="teacher">Teacher</option>
              <option value="accounting">Accounting</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="userPassword">Password</label>
          <input type="password" id="userPassword" class="form-input" placeholder="Leave blank to keep current">
          <div class="form-hint">Min 6 characters. Leave blank when editing to keep current password.</div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="userEmail">Email</label>
            <input type="email" id="userEmail" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label" for="userPhone">Phone</label>
            <input type="text" id="userPhone" class="form-input">
          </div>
        </div>
        <div class="btn-group" style="margin-top:8px;">
          <button type="submit" class="btn btn-primary">Save User</button>
          <button type="button" class="btn btn-outline" onclick="closeUserModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allUsers = [];

    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth(['admin'])) return;
      renderLayout('admin', 'Manage Users', 'manage-users.html');
      loadUsers();
    });

    async function loadUsers() {
      try {
        const data = await apiCall('/api/admin/users');
        allUsers = data || [];
        renderUsers(allUsers);
      } catch (e) {
        document.getElementById('usersTableBody').innerHTML =
          '<tr><td colspan="7" class="text-center text-muted" style="padding:32px;">Could not load users. Server may be offline.</td></tr>';
      }
    }

    function renderUsers(users) {
      const tbody = document.getElementById('usersTableBody');
      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted" style="padding:32px;">No users found.</td></tr>';
        return;
      }
      tbody.innerHTML = users.map((u, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${u.full_name}</td>
          <td>${u.username}</td>
          <td><span class="badge badge-blue">${u.role}</span></td>
          <td>${u.email || '—'}</td>
          <td><span class="badge ${u.is_active ? 'badge-green' : 'badge-red'}">${u.is_active ? 'Active' : 'Inactive'}</span></td>
          <td>
            <div class="btn-group">
              <button class="btn btn-outline btn-sm" onclick="editUser(${u.id})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterUsers() {
      const q = document.getElementById('searchUsers').value.toLowerCase();
      const filtered = allUsers.filter(u =>
        u.full_name.toLowerCase().includes(q) ||
        u.username.toLowerCase().includes(q) ||
        u.role.toLowerCase().includes(q)
      );
      renderUsers(filtered);
    }

    function openAddUserModal() {
      document.getElementById('userModalTitle').textContent = 'Add New User';
      document.getElementById('userForm').reset();
      document.getElementById('userId').value = '';
      document.getElementById('userPassword').required = true;
      document.getElementById('userModal').classList.add('active');
    }

    function closeUserModal() {
      document.getElementById('userModal').classList.remove('active');
    }

    function editUser(id) {
      const u = allUsers.find(x => x.id === id);
      if (!u) return;
      document.getElementById('userModalTitle').textContent = 'Edit User';
      document.getElementById('userId').value = u.id;
      document.getElementById('userFullName').value = u.full_name;
      document.getElementById('userUsername').value = u.username;
      document.getElementById('userRole').value = u.role;
      document.getElementById('userEmail').value = u.email || '';
      document.getElementById('userPhone').value = u.phone || '';
      document.getElementById('userPassword').value = '';
      document.getElementById('userPassword').required = false;
      document.getElementById('userModal').classList.add('active');
    }

    async function saveUser(e) {
      e.preventDefault();
      const id = document.getElementById('userId').value;
      const body = {
        full_name: document.getElementById('userFullName').value,
        username: document.getElementById('userUsername').value,
        role: document.getElementById('userRole').value,
        email: document.getElementById('userEmail').value,
        phone: document.getElementById('userPhone').value,
      };
      const pw = document.getElementById('userPassword').value;
      if (pw) body.password = pw;

      try {
        if (id) {
          await apiCall(`/api/admin/users/${id}`, 'PUT', body);
          showToast('User updated successfully');
        } else {
          if (!pw) { alert('Password is required for new users.'); return; }
          await apiCall('/api/admin/users', 'POST', body);
          showToast('User created successfully');
        }
        closeUserModal();
        loadUsers();
      } catch (e) {
        showToast('Error saving user', 'danger');
      }
    }

    async function deleteUser(id) {
      if (!confirmAction('Are you sure you want to delete this user?')) return;
      try {
        await apiCall(`/api/admin/users/${id}`, 'DELETE');
        showToast('User deleted');
        loadUsers();
      } catch (e) {
        showToast('Error deleting user', 'danger');
      }
    }
  </script>
</body>
</html>
