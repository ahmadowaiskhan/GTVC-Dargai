<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('gtvc_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <title>View Results — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
  <script src="/assets/admin-results.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-navbar"></header>
      <main class="app-content">

        <div class="page-header">
          <h1>View Results</h1>
          <p>Student exam results across all classes.</p>
        </div>

        <div class="toolbar">
          <div class="search-box">
            <input type="text" id="searchResults" placeholder="Search by student name..." oninput="filterResults()">
          </div>
          <select id="filterExamType" class="form-select" style="width:auto;" onchange="filterResults()">
            <option value="">All Exam Types</option>
            <option value="monthly">Monthly</option>
            <option value="midterm">Midterm</option>
            <option value="final">Final</option>
            <option value="practical">Practical</option>
          </select>
        </div>

        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Student Name</th>
                  <th>Class</th>
                  <th>Subject</th>
                  <th>Exam Type</th>
                  <th>Obtained</th>
                  <th>Total</th>
                  <th>Grade</th>
                </tr>
              </thead>
              <tbody id="resultsTableBody">
                <tr><td colspan="8" class="text-center text-muted" style="padding:32px;">Loading results...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
      <footer class="app-footer"></footer>
    </div>
  </div>
</body>
</html>
