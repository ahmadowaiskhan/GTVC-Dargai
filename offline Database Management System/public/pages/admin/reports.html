<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('gtvc_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <title>Reports — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-navbar"></header>
      <main class="app-content">

        <div class="page-header">
          <h1>Reports</h1>
          <p>Generate and print various reports.</p>
        </div>

        <div class="stats-grid">
          <div class="stat-card" style="cursor:pointer;" onclick="generateReport('students')">
            <div class="stat-label" style="font-size:1rem; font-weight:600;">Student Enrollment Report</div>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">List of all enrolled students with details.</p>
          </div>
          <div class="stat-card" style="cursor:pointer;" onclick="generateReport('teachers')">
            <div class="stat-label" style="font-size:1rem; font-weight:600;">Teacher / Staff Report</div>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Complete list of teaching staff.</p>
          </div>
          <div class="stat-card" style="cursor:pointer;" onclick="generateReport('results')">
            <div class="stat-label" style="font-size:1rem; font-weight:600;">Exam Results Report</div>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Student results and grade sheets.</p>
          </div>
        </div>

        <!-- Report Output -->
        <div class="card" id="reportOutput" style="display:none;">
          <div class="card-header">
            <h3 class="card-title" id="reportTitle">Report</h3>
            <button class="btn btn-outline btn-sm" onclick="window.print()">Print</button>
          </div>
          <div id="reportContent"></div>
        </div>

      </main>
      <footer class="app-footer"></footer>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireAuth(['admin'])) return;
      renderLayout('admin', 'Reports', 'reports.html');
    });

    async function generateReport(type) {
      const output = document.getElementById('reportOutput');
      const title = document.getElementById('reportTitle');
      const content = document.getElementById('reportContent');

      const titles = {
        students: 'Student Enrollment Report',
        teachers: 'Teacher / Staff Report',
        results: 'Exam Results Report'
      };
      title.textContent = titles[type] || 'Report';
      output.style.display = 'block';

      try {
        const data = await apiCall(`/api/reports/${type}`);
        if (!data || !data.length) {
          content.innerHTML = '<div class="empty-state"><p>No data available for this report.</p></div>';
          return;
        }
        // Build a simple table from the data
        const keys = Object.keys(data[0]);
        content.innerHTML = `
          <div class="table-wrapper">
            <table>
              <thead><tr>${keys.map(k => `<th>${k.replace(/_/g, ' ')}</th>`).join('')}</tr></thead>
              <tbody>${data.map(row => `<tr>${keys.map(k => `<td>${row[k] ?? '—'}</td>`).join('')}</tr>`).join('')}</tbody>
            </table>
          </div>
        `;
      } catch (e) {
        content.innerHTML = '<div class="empty-state"><p>Could not generate report. Server may be offline.</p></div>';
      }
    }
  </script>
</body>
</html>
