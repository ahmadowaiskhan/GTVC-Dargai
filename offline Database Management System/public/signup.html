<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GTVC Dargai - Offline Database Management System Signup">
  <title>Sign Up — GTVC Dargai</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="login-page" style="padding: 24px 16px;">
    <div class="login-card" style="max-width: 480px;">
      <div class="login-logo">G</div>
      <h1>Create Account</h1>
      <p class="subtitle">Government Technical & Vocational Centre, Malakand</p>

      <div id="signupAlert" class="alert hidden" style="text-align: left; margin-bottom: 16px;"></div>

      <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="form-row" style="grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 0;">
          <div class="form-group">
            <label class="form-label" for="full_name">Full Name <span style="color:var(--color-danger)">*</span></label>
            <input type="text" id="full_name" class="form-input" placeholder="e.g. Ahmad Khan" required autocomplete="name">
          </div>
          <div class="form-group">
            <label class="form-label" for="username">Username <span style="color:var(--color-danger)">*</span></label>
            <input type="text" id="username" class="form-input" placeholder="e.g. ahmad_k" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Account Role <span style="color:var(--color-danger)">*</span></label>
          <select id="role" class="form-input" required>
            <option value="teacher" selected>Teacher / Instructor</option>
            <option value="principal">Principal</option>
            <option value="admin">Administrator</option>
            <option value="accounting">Accounting / Finance</option>
          </select>
        </div>

        <div class="form-row" style="grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 0;">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="name@gtvc.edu.pk" autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="text" id="phone" class="form-input" placeholder="0300-1234567" autocomplete="tel">
          </div>
        </div>

        <div class="form-row" style="grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 0;">
          <div class="form-group">
            <label class="form-label" for="password">Password <span style="color:var(--color-danger)">*</span></label>
            <input type="password" id="password" class="form-input" placeholder="Min. 6 characters" required autocomplete="new-password" minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password <span style="color:var(--color-danger)">*</span></label>
            <input type="password" id="confirm_password" class="form-input" placeholder="Repeat password" required autocomplete="new-password" minlength="6">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="signupBtn" style="margin-top: 8px;">Create Account</button>
      </form>

      <div class="login-footer">
        <p style="margin-bottom: 12px; font-size: 0.9rem;">
          Already have an account? <a href="/index.html" style="font-weight: 600; color: var(--color-primary);">Log In</a>
        </p>
        <button class="theme-toggle" onclick="toggleTheme()" style="margin: 8px auto 0;" title="Toggle theme">Theme</button>
        <p style="margin-top:8px;">Offline Database Management System</p>
      </div>
    </div>
  </div>

  <script>
    // If already logged in, redirect to dashboard
    (function() {
      const user = getUser();
      const token = getToken();
      if (user && token) {
        redirectToDashboard(user.role);
      }
    })();

    function redirectToDashboard(role) {
      const paths = {
        admin: '/pages/admin/dashboard.html',
        principal: '/pages/principal/dashboard.html',
        teacher: '/pages/teacher/dashboard.html',
        accounting: '/pages/accounting/dashboard.html'
      };
      window.location.href = paths[role] || '/index.html';
    }

    async function handleSignup(e) {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      const alertDiv = document.getElementById('signupAlert');
      
      const full_name = document.getElementById('full_name').value.trim();
      const username = document.getElementById('username').value.trim();
      const role = document.getElementById('role').value;
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirm_password = document.getElementById('confirm_password').value;

      alertDiv.className = 'alert hidden';

      if (password !== confirm_password) {
        alertDiv.className = 'alert alert-danger';
        alertDiv.textContent = 'Passwords do not match. Please re-enter.';
        alertDiv.classList.remove('hidden');
        return;
      }

      if (password.length < 6) {
        alertDiv.className = 'alert alert-danger';
        alertDiv.textContent = 'Password must be at least 6 characters long.';
        alertDiv.classList.remove('hidden');
        return;
      }

      btn.textContent = 'Creating Account...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name,
            username,
            role,
            email,
            phone,
            password
          })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          alertDiv.className = 'alert alert-success';
          alertDiv.textContent = 'Registration successful! Redirecting...';
          alertDiv.classList.remove('hidden');

          if (data.token && data.user) {
            setAuth(data.token, data.user);
            setTimeout(() => {
              redirectToDashboard(data.user.role);
            }, 800);
          } else {
            setTimeout(() => {
              window.location.href = '/index.html?registered=true';
            }, 800);
          }
        } else {
          alertDiv.className = 'alert alert-danger';
          alertDiv.textContent = data.message || 'Failed to create account. Please try again.';
          alertDiv.classList.remove('hidden');
          btn.textContent = 'Create Account';
          btn.disabled = false;
        }
      } catch (err) {
        alertDiv.className = 'alert alert-danger';
        alertDiv.textContent = 'Cannot connect to server. Make sure the server is running.';
        alertDiv.classList.remove('hidden');
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
